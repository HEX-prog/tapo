<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TP-Link Tapo ULL Sender (WebCodecs)</title>
    <style>
        :root {
            --bg-color: #0b0b0e;
            --surface-color: #121217;
            --border-color: #1f1f28;
            --accent-color: #4CAF50;
            --accent-hover: #66bb6a;
            --text-color: #e2e8f0;
            --text-muted: #6b7280;
            --danger-color: #ef4444;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            width: 100%;
            max-width: 650px;
            padding: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }
        h2 {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 4px;
            color: var(--accent-color);
        }
        .brand {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-bottom: 16px;
        }
        .section {
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }
        .section:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }
        label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 6px;
        }
        input, select {
            width: 100%;
            background-color: #1a1a23;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 10px 12px;
            color: var(--text-color);
            font-family: inherit;
            font-size: 0.9rem;
            margin-bottom: 12px;
            transition: border-color 0.15s;
        }
        input:focus, select:focus {
            outline: none;
            border-color: var(--accent-color);
        }
        .row {
            display: flex;
            gap: 12px;
        }
        .row > div {
            flex: 1;
        }
        button {
            width: 100%;
            background-color: var(--accent-color);
            color: #000;
            border: none;
            border-radius: 6px;
            padding: 12px;
            font-weight: 700;
            font-size: 0.875rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: background-color 0.15s, transform 0.1s;
            margin-bottom: 10px;
        }
        button:hover { background-color: var(--accent-hover); }
        button:active { transform: scale(0.98); }
        button:disabled { background-color: #2a2a35; color: #555; cursor: not-allowed; }
        button.stop { background-color: var(--danger-color); color: #fff; }
        button.stop:hover { background-color: #ff6b6b; }
        .preview-container {
            border: 1px solid var(--border-color);
            border-radius: 6px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            background-color: #000;
            position: relative;
        }
        #preview-canvas {
            display: block;
            max-width: 100%;
            height: auto;
        }
        .stats-panel {
            background-color: #0d0d12;
            border: 1px solid #1a1a23;
            border-radius: 6px;
            padding: 12px;
            font-size: 0.85rem;
            font-family: monospace;
            color: var(--accent-color);
            margin-top: 15px;
            line-height: 1.5;
        }
        .notice {
            font-size: 0.75rem;
            color: #f59e0b;
            background: rgba(245, 158, 11, 0.1);
            padding: 8px;
            border-radius: 4px;
            margin-bottom: 15px;
            border-left: 3px solid #f59e0b;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>📹 TP-Link Tapo ULL (WebCodecs)</h2>
    <div class="brand">Ultra Düşük Gecikmeli WebTransport Sender</div>
    
    <div class="notice">
        <b>Not:</b> Bu sistem, WebRTC MediaStream yerine <strong>WebCodecs API</strong> ve <strong>WebTransport</strong> kullanılarak donanım seviyesinde sıfırdan yazılmıştır.
    </div>
    <div class="section">
        <label>🌐 WebTransport Sunucu URL</label>
        <input type="text" id="wt-url" value="https://127.0.0.1:4433/stream">
        
        <label>🔐 Sertifika Hash (Başka bilgisayardan bağlanıyorsanız ZORUNLU)</label>
        <input type="text" id="wt-hash" placeholder="CVM arayüzünden kopyaladığınız hash'i buraya yapıştırın" style="font-family: monospace; font-size: 0.8rem;">
        
        <div class="row">
            <div>
                <label>Kırpma Genişliği</label>
                <input type="number" id="v-width" value="320">
            </div>
            <div>
                <label>Kırpma Yüksekliği</label>
                <input type="number" id="v-height" value="320">
            </div>
            <div>
                <label>Hedef FPS</label>
                <input type="number" id="v-fps" value="60">
            </div>
        </div>
        
        <div class="row">
            <div>
                <label>🎬 Encoder Codec</label>
                <select id="v-codec">
                    <!-- Donanım hızlandırmalı en yaygın low-latency codecler -->
                    <option value="avc1.42002A">H.264 (Constrained Baseline)</option>
                    <option value="vp8">VP8</option>
                    <option value="av01.0.04M.08">AV1 (Eğer destekleniyorsa)</option>
                </select>
            </div>
            <div>
                <label>⚡ Bitrate (kbps)</label>
                <input type="number" id="v-bitrate" value="2000"> <!-- 2000 kbps = 2 Mbps -->
            </div>
        </div>
        
        <button id="btn-camera">1. Ekranı Seç ve Yakala</button>
        <button id="btn-stream" disabled>2. Buluta Aktar (WebTransport)</button>
    </div>
    <div class="section">
        <label>Önizleme (Merkez Kırpma)</label>
        <div class="preview-container">
            <canvas id="preview-canvas" width="320" height="320"></canvas>
        </div>
        
        <div class="stats-panel" id="stats-panel">
            [DURUM] Bekliyor...<br>
            [AĞ] 0 kbps | 0 FPS
        </div>
    </div>
</div>
<script>
    // ══════════════════════════════════════════════════════════════════════════
    // ★ MERKEZİ STATE (DURUM) YÖNETİMİ ★
    // ══════════════════════════════════════════════════════════════════════════
    const state = {
        videoElement: document.createElement('video'),
        canvas: document.getElementById('preview-canvas'),
        ctx: document.getElementById('preview-canvas').getContext('2d', { 
            alpha: false, 
            desynchronized: true // GPU hızlandırması ve düşük gecikme için kritik
        }),
        transport: null,
        wtWriter: null, // WebTransport Unidirectional Stream Writer
        encoder: null,
        isStreaming: false,
        cameraActive: false,
        frameCount: 0,
        bytesSent: 0,
        statsInterval: null
    };
    // UI Bileşenleri
    const btnCamera = document.getElementById('btn-camera');
    const btnStream = document.getElementById('btn-stream');
    const statsPanel = document.getElementById('stats-panel');
    const inputW = document.getElementById('v-width');
    const inputH = document.getElementById('v-height');
    const inputFPS = document.getElementById('v-fps');
    const inputCodec = document.getElementById('v-codec');
    const inputBitrate = document.getElementById('v-bitrate');
    // ══════════════════════════════════════════════════════════════════════════
    // 1. KAMERA BAŞLATMA VE RENDER DÖNGÜSÜ
    // ══════════════════════════════════════════════════════════════════════════
    btnCamera.addEventListener('click', async () => {
        if (state.cameraActive) return;
        try {
            // Ekran paylaşımı (native çözünürlük)
            const stream = await navigator.mediaDevices.getDisplayMedia({
                video: { 
                    frameRate: { ideal: parseInt(inputFPS.value) },
                    cursor: "never"
                },
                audio: false
            });
            
            state.videoElement.srcObject = stream;
            state.videoElement.playsInline = true;
            state.videoElement.muted = true;
            await state.videoElement.play();
            
            // Hedef kırpma (crop) çözünürlüğünü Canvas'a uyarla
            state.canvas.width = parseInt(inputW.value);
            state.canvas.height = parseInt(inputH.value);
            
            state.cameraActive = true;
            btnCamera.textContent = "✓ Ekran Yakalama Aktif";
            btnCamera.disabled = true;
            btnStream.disabled = false;
            
            // Render loop'u başlat (Mümkünse en düşük gecikmeli yöntem olan rVFC ile)
            if ('requestVideoFrameCallback' in state.videoElement) {
                state.videoElement.requestVideoFrameCallback(renderLoopRVFC);
            } else {
                requestAnimationFrame(renderLoopRAF);
            }
        } catch (e) {
            alert("Ekran yakalama hatası: " + e.message);
        }
    });
    // Donanım destekli, ekrana gelmeden önceki en saf anı yakalayan döngü (requestVideoFrameCallback)
    function renderLoopRVFC(now, metadata) {
        if (!state.cameraActive) return;
        
        // 1. Görüntünün merkezini Canvas boyutuna göre kırp (Crop Center)
        const srcW = state.videoElement.videoWidth;
        const srcH = state.videoElement.videoHeight;
        const cropW = state.canvas.width;
        const cropH = state.canvas.height;
        
        const startX = Math.max(0, Math.floor((srcW - cropW) / 2));
        const startY = Math.max(0, Math.floor((srcH - cropH) / 2));
        const drawW = Math.min(srcW, cropW);
        const drawH = Math.min(srcH, cropH);
        
        state.ctx.drawImage(
            state.videoElement, 
            startX, startY, drawW, drawH, // Kaynak x, y, w, h
            0, 0, drawW, drawH            // Hedef x, y, w, h
        );
        
        // 2. Eğer aktarım başladıysa Frame'i Encoder'a yolla
        encodeCurrentFrame(metadata.mediaTime * 1000000); // mediaTime saniye cinsindendir, mikrosaniyeye çevir
        
        state.videoElement.requestVideoFrameCallback(renderLoopRVFC);
    }
    // Fallback: Standart requestAnimationFrame
    function renderLoopRAF() {
        if (!state.cameraActive) return;
        
        const srcW = state.videoElement.videoWidth;
        const srcH = state.videoElement.videoHeight;
        const cropW = state.canvas.width;
        const cropH = state.canvas.height;
        
        const startX = Math.max(0, Math.floor((srcW - cropW) / 2));
        const startY = Math.max(0, Math.floor((srcH - cropH) / 2));
        const drawW = Math.min(srcW, cropW);
        const drawH = Math.min(srcH, cropH);
        
        state.ctx.drawImage(
            state.videoElement, 
            startX, startY, drawW, drawH,
            0, 0, drawW, drawH
        );
        
        encodeCurrentFrame(performance.now() * 1000);
        requestAnimationFrame(renderLoopRAF);
    }
    function encodeCurrentFrame(timestampMicroseconds) {
        if (state.isStreaming && state.encoder && state.encoder.state === "configured") {
            const fps = parseInt(inputFPS.value);
            // Her X saniyede bir Keyframe zorla (örneğin her 2 saniyede bir)
            const insertKeyframe = (state.frameCount % (fps * 2) === 0);
            
            // Canvas'tan GPU'daki VideoFrame nesnesini kopar
            const vf = new VideoFrame(state.canvas, { timestamp: timestampMicroseconds });
            
            try {
                state.encoder.encode(vf, { keyFrame: insertKeyframe });
            } catch (e) {
                console.error("Encoding error:", e);
            }
            
            // Frame hafızasını hemen boşalt (memory leak engellemek için KRİTİK)
            vf.close();
            state.frameCount++;
        }
    }
    // ══════════════════════════════════════════════════════════════════════════
    // 2. WEBTRANSPORT & WEBCODECS BAŞLATMA
    // ══════════════════════════════════════════════════════════════════════════
    btnStream.addEventListener('click', async () => {
        if (state.isStreaming) {
            stopStream();
            return;
        }
        
        try {
            updateStats("[BAĞLANTI] WebTransport sunucusuna bağlanılıyor...");
            const url = document.getElementById('wt-url').value;
            const hashHex = document.getElementById('wt-hash').value.trim();
            
            let wtOptions = {};
            if (hashHex && hashHex.length === 64) {
                // Hex string'i Uint8Array'e çevir
                const hashBytes = new Uint8Array(hashHex.match(/.{1,2}/g).map(byte => parseInt(byte, 16)));
                wtOptions = {
                    serverCertificateHashes: [{ algorithm: "sha-256", value: hashBytes }]
                };
                console.log("Using certificate hash:", hashHex);
            }
            
            // WebTransport (QUIC tabanlı UDP bağlantısı)
            state.transport = new WebTransport(url, wtOptions);
            await state.transport.ready;
            
            updateStats("[BAĞLANTI] Başarılı! Video kanalı açılıyor...");
            
            // Unidirectional Stream oluştur (Reliable, ama QUIC sayesinde TCP gibi tüm yayını bloke etmez)
            // İsterseniz Datagram (transport.datagrams) da kullanılabilir ancak MTU sınırlaması nedeniyle parçalama (fragmentation) gerekir.
            const wtStream = await state.transport.createUnidirectionalStream();
            state.wtWriter = wtStream.getWriter();
            
            updateStats("[ENCODER] WebCodecs VideoEncoder başlatılıyor...");
            initEncoder();
            
            state.isStreaming = true;
            btnStream.textContent = "2. Aktarımı Durdur (WebTransport)";
            btnStream.classList.add('stop');
            
            startStatsMonitor();
            
        } catch (e) {
            console.error("Bağlantı Hatası:", e);
            alert("WebTransport Hatası:\nSunucu çalışmıyor olabilir veya SSL sertifika hatası (localhost harici).");
            stopStream();
        }
    });
    function initEncoder() {
        const codec = inputCodec.value;
        const bitrateBps = parseInt(inputBitrate.value) * 1000;
        const fps = parseInt(inputFPS.value);
        
        state.encoder = new VideoEncoder({
            output: handleEncodedChunk,
            error: (e) => {
                console.error("[WebCodecs] Encoder çöktü:", e);
                stopStream();
            }
        });
        
        state.encoder.configure({
            codec: codec,
            width: state.canvas.width,
            height: state.canvas.height,
            bitrate: bitrateBps,
            framerate: fps,
            // Gerçek zamanlı, sıfır gecikmeli (zero-latency) encoding ayarı
            latencyMode: 'realtime', 
            // H.264 için standart format (decoder tarafında description olmadan çalışabilmesi için annexb avantajlıdır)
            avc: { format: 'annexb' } 
        });
    }
    // ══════════════════════════════════════════════════════════════════════════
    // 3. PAKETLEME VE GÖNDERME (CHUNKING)
    // ══════════════════════════════════════════════════════════════════════════
    async function handleEncodedChunk(chunk, metadata) {
        if (!state.isStreaming || !state.wtWriter) return;
        
        const chunkData = new Uint8Array(chunk.byteLength);
        chunk.copyTo(chunkData);
        
        // ── Kendi Özel Frame Protokolümüz ──
        // [1 Byte] Frame Tipi (0=Delta, 1=KeyFrame, 2=DecoderConfig)
        // [8 Byte] Timestamp (Float64)
        // [4 Byte] Payload Length (Uint32)
        // [N Byte] Gerçek Video Verisi
        
        // Decoder'ın (Receiver) yayını açabilmesi için ilk gelen metadata.description bilgisini yollamamız şarttır.
        if (metadata && metadata.decoderConfig && metadata.decoderConfig.description) {
            const desc = new Uint8Array(metadata.decoderConfig.description);
            sendWebTransportPacket(2, 0, desc);
        }
        
        const isKey = chunk.type === 'key' ? 1 : 0;
        sendWebTransportPacket(isKey, chunk.timestamp, chunkData);
    }
    
    async function sendWebTransportPacket(type, timestamp, data) {
        if (!state.wtWriter) return;
        
        // Header oluşturma (13 byte)
        const header = new ArrayBuffer(13);
        const view = new DataView(header);
        view.setUint8(0, type);
        view.setFloat64(1, timestamp, true); // Little endian
        view.setUint32(9, data.byteLength, true); // Little endian
        
        // Header ve veriyi birleştir
        const packet = new Uint8Array(13 + data.byteLength);
        packet.set(new Uint8Array(header), 0);
        packet.set(data, 13);
        
        try {
            // WebTransport Stream üzerinden veriyi yolla
            await state.wtWriter.write(packet);
            state.bytesSent += packet.byteLength;
        } catch (e) {
            console.warn("Paket yazma hatası (Kopmuş olabilir):", e);
            stopStream();
        }
    }
    // ══════════════════════════════════════════════════════════════════════════
    // 4. KONTROL VE İSTATİSTİK YARDIMCILARI
    // ══════════════════════════════════════════════════════════════════════════
    function stopStream() {
        state.isStreaming = false;
        
        if (state.statsInterval) {
            clearInterval(state.statsInterval);
            state.statsInterval = null;
        }
        
        if (state.encoder && state.encoder.state !== "closed") {
            state.encoder.close();
        }
        state.encoder = null;
        
        if (state.wtWriter) {
            state.wtWriter.close().catch(()=>{});
            state.wtWriter = null;
        }
        
        if (state.transport) {
            state.transport.close();
            state.transport = null;
        }
        
        btnStream.textContent = "2. Buluta Aktar (WebTransport)";
        btnStream.classList.remove('stop');
        updateStats("[DURUM] Yayın durduruldu.");
    }
    function updateStats(msg) {
        const lines = statsPanel.innerHTML.split('<br>');
        if (lines.length > 1) {
            statsPanel.innerHTML = msg + "<br>" + lines[1];
        } else {
            statsPanel.innerHTML = msg;
        }
    }
    function startStatsMonitor() {
        let lastBytes = 0;
        let lastFrames = 0;
        
        state.statsInterval = setInterval(() => {
            const currentBytes = state.bytesSent;
            const currentFrames = state.frameCount;
            
            const bps = (currentBytes - lastBytes) * 8; // saniyedeki bit
            const kbps = (bps / 1000).toFixed(1);
            const fps = (currentFrames - lastFrames);
            
            statsPanel.innerHTML = `[DURUM] YAYINDA (WebCodecs + QUIC/WebTransport)<br>[AĞ] Gönderilen: <span style="color:#fff">${fps} FPS</span> | <span style="color:#fff">${kbps} kbps</span>`;
            
            lastBytes = currentBytes;
            lastFrames = currentFrames;
        }, 1000);
    }
</script>
</body>
</html>
